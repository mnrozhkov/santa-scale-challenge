[project]
name = "santa-scale-challenge"
version = "0.1.0"
description = "AI Orchestration & Agentic Deployment for generating personalized gift cards at scale"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Santa Scale Challenge Team"}
]
keywords = ["llm", "ai", "gift-cards", "mlflow", "skypilot", "nebius"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mlflow==3.5.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.11.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "html2image>=2.0.0",
    "boto3>=1.35.0",
]

# [project.optional-dependencies]
# # SkyPilot for distributed processing
# skypilot = [
#     "skypilot>=0.11.0",
# ]

[dependency-groups]
# Development dependencies (for uv sync --group dev)
dev = [
    "jupyterlab>=4.5.0",
    "ipykernel",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "detect-secrets>=1.4.0",
]
skypilot = [
    # "boto3>=1.42.12",
    "skypilot-nightly[nebius]>=1.0.0.dev20251217",
]

[project.urls]
Homepage = "https://github.com/your-org/santa-scale-challenge"
Documentation = "https://github.com/your-org/santa-scale-challenge#readme"
Repository = "https://github.com/your-org/santa-scale-challenge"
Issues = "https://github.com/your-org/santa-scale-challenge/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["santa_scale_challenge"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=santa_scale_challenge",
    "--cov-report=term-missing",
    "--cov-report=html",
]
