[project]
name = "santa-scale-challenge"
version = "0.1.0"
description = "Workshop media-gen on Nebius Serverless: personalized gift cards with LLM, image, video, and audio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Santa Scale Challenge Team"}
]
keywords = ["workshop", "media-gen", "gift-cards", "nebius", "serverless"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "jinja2>=3.1.0",
    "imageio-ffmpeg>=0.5.0",
    "boto3>=1.35.0",
    "nebius>=0.2.0",
    "pydantic-ai>=0.1.0",
    "truststore>=0.9",  # laptop TLS: santa.cli injects the OS cert store
]

[dependency-groups]
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
job = [
    "torch>=2.4.0",
    "diffusers>=0.31.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "imageio-ffmpeg>=0.5.0",
]
research = [
    "mlflow==2.21.2",
    "pandas>=2.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "aiohttp>=3.11.0",
]
dev = [
    {include-group = "service"},
    "jupyterlab>=4.5.0",
    "ipykernel",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "detect-secrets>=1.4.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
santa = "santa.cli:app"
santa-service = "santa.service.app:main"

[project.urls]
Homepage = "https://github.com/mnrozhkov/santa-scale-challenge"
Documentation = "https://github.com/mnrozhkov/santa-scale-challenge#readme"
Repository = "https://github.com/mnrozhkov/santa-scale-challenge"
Issues = "https://github.com/mnrozhkov/santa-scale-challenge/issues"

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["santa"]

[tool.hatch.build.targets.wheel.force-include]
"santa/service/templates" = "santa/service/templates"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=santa",
    "--cov-report=term-missing",
    "--cov-report=html",
]
