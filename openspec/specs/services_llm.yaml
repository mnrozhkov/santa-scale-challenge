version: 0.1.0
service:
  name: llm_service
  type: http
  host: env(LLM_HOST)
  port: 8000

endpoints:
  generate:
    description: Generate structured LLM responses.
    method: POST
    path: /v1/generate
    input:
      prompt: string
      parameters:
        temperature: float?
        max_tokens: integer?
    output:
      text: string
