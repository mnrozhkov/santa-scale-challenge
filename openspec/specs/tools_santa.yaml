version: 0.1.0
tools:
  analyze_profile:
    input: { profile_text: string }
    output: Model(KidProfile)
    description: Extract structured profile fields from messy text input.

  gift_recommender:
    input:
      kid_profile: Model(KidProfile)
    output: Model(GiftRecommendation)

  wish_generator:
    input:
      kid_profile: Model(KidProfile)
      gift_recommendation: Model(GiftRecommendation)
    output: Model(Wish)

  image_generator:
    input:
      gift_recommendation: Model(GiftRecommendation)
    output: Model(CardImage)

  card_formatter:
    input:
      kid_profile: Model(KidProfile)
      gift: Model(GiftRecommendation)
      wish: Model(Wish)
      image: Model(CardImage)
    output: Model(GiftCard)
