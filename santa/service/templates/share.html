<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:url" content="{{ share_url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  <style>
    :root { font-family: Georgia, serif; color: #2c3e50; background: #1a3a2a; }
    body { margin: 0; padding: 2rem 1rem; }
    .card { max-width: 32rem; margin: 0 auto; background: #fffaf2; border: 10px solid #b30000;
            border-radius: 16px; overflow: hidden; }
    img { display: block; width: 100%; }
    .body { padding: 1.5rem 2rem 2rem; }
    h1 { color: #b30000; margin: 0 0 1rem; font-size: 1.6rem; }
    .wish { font-size: 1.15rem; line-height: 1.5; }
    .sig { margin-top: 1.5rem; color: #b30000; font-style: italic; }
    .actions { margin-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
            padding: 0 16px; border-radius: 8px; text-decoration: none; font-family: system-ui, sans-serif;
            font-weight: 600; font-size: 0.95rem; }
    a.download { background: #2d8b5d; color: #fff; }
    a.home { background: #fff; color: #2c3e50; border: 1px solid #d9cbb8; }
  </style>
</head>
<body>
<article class="card">
  {% if png_url %}
  <img src="{{ png_url }}" alt="Holiday illustration for {{ name }}">
  {% endif %}
  <div class="body">
    <h1>To: {{ name }}</h1>
    <p class="wish">{{ wish }}</p>
    <p class="sig">— Santa</p>
    <div class="actions">
      {% if png_url %}
      <a class="btn download" href="{{ png_url }}" download>Download</a>
      {% endif %}
      <a class="btn home" href="/">Back to Santa</a>
    </div>
  </div>
</article>
</body>
</html>
