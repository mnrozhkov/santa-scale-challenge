<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="A Christmas card for Ingrid">
<meta property="og:description" content="Dear Ingrid, at six sweet years you’re already a little farmer, and I’ve placed soft farm friends, a tiny wooden barn with a fence, a sound‑filled story, and a breezy cape for your farmyard adventures. Merry Christmas!">
<meta property="og:image" content="card.png">
<meta property="og:type" content="website">
<title>A Christmas card for Ingrid</title>
<style>
  body { font-family: Georgia, serif; background: #1a3a2a; color: #fffaf2; margin: 0; padding: 2rem; }
  .card { max-width: 32rem; margin: 0 auto; background: #fffaf2; color: #2c3e50; border: 10px solid #b30000;
          border-radius: 16px; overflow: hidden; }
  img { display: block; width: 100%; }
  .body { padding: 1.5rem 2rem 2rem; }
  h1 { font-family: Georgia, serif; color: #b30000; margin: 0 0 1rem; }
  .wish { font-size: 1.15rem; line-height: 1.5; }
  .sig { margin-top: 1.5rem; color: #b30000; font-style: italic; }
</style>
</head>
<body>
<article class="card">
  <img src="card.png" alt="Holiday illustration for Ingrid">
  <div class="body">
    <h1>To: Ingrid</h1>
    <p class="wish">Dear Ingrid, at six sweet years you’re already a little farmer, and I’ve placed soft farm friends, a tiny wooden barn with a fence, a sound‑filled story, and a breezy cape for your farmyard adventures. Merry Christmas!</p>
    <p class="sig">— Santa</p>
  </div>
</article>
</body>
</html>
