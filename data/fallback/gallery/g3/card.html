<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="A Christmas card for Sofia">
<meta property="og:description" content="Dear Sofia, at seven you’re a wonderful artist, and I hear the North Pole is already sparkling with the colors you’ll paint and the magical sketches you’ll create on pages that flutter like snowflakes. May your days be filled with joyful stickers and stencils. Merry Christmas!">
<meta property="og:image" content="card.png">
<meta property="og:type" content="website">
<title>A Christmas card for Sofia</title>
<style>
  body { font-family: Georgia, serif; background: #1a3a2a; color: #fffaf2; margin: 0; padding: 2rem; }
  .card { max-width: 32rem; margin: 0 auto; background: #fffaf2; color: #2c3e50; border: 10px solid #b30000;
          border-radius: 16px; overflow: hidden; }
  img { display: block; width: 100%; }
  .body { padding: 1.5rem 2rem 2rem; }
  h1 { font-family: Georgia, serif; color: #b30000; margin: 0 0 1rem; }
  .wish { font-size: 1.15rem; line-height: 1.5; }
  .sig { margin-top: 1.5rem; color: #b30000; font-style: italic; }
</style>
</head>
<body>
<article class="card">
  <img src="card.png" alt="Holiday illustration for Sofia">
  <div class="body">
    <h1>To: Sofia</h1>
    <p class="wish">Dear Sofia, at seven you’re a wonderful artist, and I hear the North Pole is already sparkling with the colors you’ll paint and the magical sketches you’ll create on pages that flutter like snowflakes. May your days be filled with joyful stickers and stencils. Merry Christmas!</p>
    <p class="sig">— Santa</p>
  </div>
</article>
</body>
</html>
