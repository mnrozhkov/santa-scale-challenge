<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="A Christmas card for Nick">
<meta property="og:description" content="Dear Nick, at five years old you’re already a brave explorer who loves amazing adventures. I’ve tucked a special surprise that will let you build a roaring dinosaur kingdom and a cozy barn for gentle friends, all hidden inside a twinkling tent of lights. Merry Christmas!">
<meta property="og:image" content="card.png">
<meta property="og:type" content="website">
<title>A Christmas card for Nick</title>
<style>
  body { font-family: Georgia, serif; background: #1a3a2a; color: #fffaf2; margin: 0; padding: 2rem; }
  .card { max-width: 32rem; margin: 0 auto; background: #fffaf2; color: #2c3e50; border: 10px solid #b30000;
          border-radius: 16px; overflow: hidden; }
  img { display: block; width: 100%; }
  .body { padding: 1.5rem 2rem 2rem; }
  h1 { font-family: Georgia, serif; color: #b30000; margin: 0 0 1rem; }
  .wish { font-size: 1.15rem; line-height: 1.5; }
  .sig { margin-top: 1.5rem; color: #b30000; font-style: italic; }
</style>
</head>
<body>
<article class="card">
  <img src="card.png" alt="Holiday illustration for Nick">
  <div class="body">
    <h1>To: Nick</h1>
    <p class="wish">Dear Nick, at five years old you’re already a brave explorer who loves amazing adventures. I’ve tucked a special surprise that will let you build a roaring dinosaur kingdom and a cozy barn for gentle friends, all hidden inside a twinkling tent of lights. Merry Christmas!</p>
    <p class="sig">— Santa</p>
  </div>
</article>
</body>
</html>
