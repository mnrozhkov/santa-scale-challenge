<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="A Christmas card for Mia">
<meta property="og:description" content="Dear Mia, may your wooden train race through the snow tonight. Merry Christmas!">
<meta property="og:image" content="card-01.png">
<meta property="og:type" content="website">
<title>A Christmas card for Mia</title>
<style>
  body { font-family: Georgia, serif; background: #1a3a2a; color: #fffaf2; margin: 0; padding: 2rem; }
  .card { max-width: 32rem; margin: 0 auto; background: #fffaf2; color: #2c3e50; border: 10px solid #b30000;
          border-radius: 16px; overflow: hidden; }
  img { display: block; width: 100%; }
  .body { padding: 1.5rem 2rem 2rem; }
  h1 { font-family: Georgia, serif; color: #b30000; margin: 0 0 1rem; }
  .wish { font-size: 1.15rem; line-height: 1.5; }
  .gifts { margin: 1.25rem 0 0; padding: 0; list-style: none; }
  .gifts li { padding: 0.2rem 0; }
  .sig { margin-top: 1.5rem; color: #b30000; font-style: italic; }
</style>
</head>
<body>
<article class="card">
  <img src="card-01.png" alt="Holiday illustration for Mia">
  <div class="body">
    <h1>To: Mia</h1>
    <p class="wish">Dear Mia, may your wooden train race through the snow tonight. Merry Christmas!</p>
    <ul class="gifts">
    <li>wooden train</li>
    <li>picture book</li>
    </ul>
    <p class="sig">— Santa</p>
  </div>
</article>
</body>
</html>
